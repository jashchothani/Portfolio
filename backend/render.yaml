services:
  - type: web
    name: jash-chothani-portfolio-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: FRONTEND_URL
        value: https://jashchothani.vercel.app
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_USER
        value: jashthakkar77@gmail.com
      - key: SMTP_PASS
        value: lxnsmoexuvcmlpcf
      - key: CONTACT_TO_EMAIL
        value: jashthakkar77@gmail.com
      - key: SMTP_FROM
        value: Jash Chothani <jashthakkar77@gmail.com>
      - key: RESEND_API_KEY
        sync: false
