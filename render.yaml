services:
  - type: web
    name: jash-portfolio-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_USER
        value: jashthakkar77@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO_EMAIL
        value: jashthakkar77@gmail.com
      - key: SMTP_FROM
        value: "Jash Chothani <jashthakkar77@gmail.com>"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
